<!doctype html>
<html lang="en" data-surface="main" class="theme-night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Proofwork</title>
    <!-- Runs before first paint: overlay surfaces must start with a transparent background. -->
    <script>
      (function () {
        var surface = new URLSearchParams(location.search).get("surface") || "main";
        document.documentElement.dataset.surface = surface;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
